name: iPhone TestFlight

# Uploads the iPhone app to App Store Connect (TestFlight) whenever VERSION or ios/ changes on main, or on
# demand. Needs four repository secrets: an App Store Connect API key (ASC_KEY_ID, ASC_ISSUER_ID and
# ASC_KEY_P8, the .p8 file's contents) and the Apple team (APPLE_TEAM_ID); plus the app created in App
# Store Connect with bundle ID com.bradcowdrey.goldenhour. Signing is automatic through the API key, as in
# the Two Degrees repository. Without the secrets the upload job does nothing.
# Every run, and every pull request that touches ios/, also compiles the app for the simulator, unsigned.
on:
  push:
    branches: [main]
    paths: [VERSION, "ios/**", .github/workflows/ios-testflight.yml]
  pull_request:
    paths: ["ios/**", .github/workflows/ios-testflight.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-signing
  cancel-in-progress: false

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build for the simulator, unsigned
        working-directory: ios
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --quiet
          LOG="$RUNNER_TEMP/build.log"
          xcodebuild -project GoldenHour.xcodeproj -scheme GoldenHour -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build > "$LOG" 2>&1 \
            || { grep -E "(error|fatal):" "$LOG" | sort -u | head -25 | sed 's/^/::error::/'; tail -40 "$LOG"; exit 1; }
          echo "::notice::Golden Hour for iPhone compiles."

  upload:
    needs: compile
    if: github.event_name != 'pull_request'
    # App Store Connect only accepts apps built with the iOS 26 SDK (Xcode 26) or later.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Waiting for the App Store Connect key
        if: env.HAS_KEY != 'true'
        run: echo "::warning::Not uploaded. Add the repository secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID, then run this workflow again."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0
      - name: Newest Xcode
        if: env.HAS_KEY == 'true'
        run: |
          XC="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Clear the last build's throwaway signing certificates
        if: env.HAS_KEY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Each run's development certificate dies with its machine, and Apple caps how many an account holds.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]==2.9.0"
          "$RUNNER_TEMP/venv/bin/python" scripts/appstore_certs.py
      - name: Archive and upload
        if: env.HAS_KEY == 'true'
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="$(tr -d '[:space:]' < ../VERSION)"; BUILD="$(git rev-list --count HEAD)"
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"; printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --quiet
          LOG="$RUNNER_TEMP/archive.log"
          xcodebuild -project GoldenHour.xcodeproj -scheme GoldenHour -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/GoldenHour.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Development" \
            "${AUTH[@]}" archive > "$LOG" 2>&1 \
            || { grep -E "(error|fatal):" "$LOG" | sort -u | head -25 | sed 's/^/::error::/'; tail -40 "$LOG"; exit 1; }
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/GoldenHour.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" > "$RUNNER_TEMP/export.log" 2>&1 \
            || { grep -iE "error" "$RUNNER_TEMP/export.log" | sort -u | head -25 | sed 's/^/::error::/'; tail -40 "$RUNNER_TEMP/export.log"; exit 1; }
          rm -f "$KEY"
          echo "::notice::Uploaded Golden Hour for iPhone $VERSION (build $BUILD) to App Store Connect. It shows in TestFlight once Apple finishes processing it."
