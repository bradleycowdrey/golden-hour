name: Android

# Builds the Android app (android/: the web app in a full-screen web view, like the iPhone app) and runs its
# unit tests. With the upload key in the repository secrets (ANDROID_KEYSTORE_B64, or ANDROID_KEYSTORE, with
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD) it also builds the release APK and
# App Bundle, signed with that key; without them only the debug APK, and the run still passes. The APKs and
# the bundle are kept as an artifact.
# Builds for testers go to Google Play's closed test (docs/play/README.md), and only from main: runs started by
# hand (Actions, Android, Run workflow) and pushes to main that change VERSION. Other pushes, pull requests
# and branches never upload. Needs PLAY_SERVICE_ACCOUNT_JSON; without it the Play step does nothing.
on:
  push:
    branches: [main]
    paths: ["android/**", VERSION, .github/workflows/android.yml]
  pull_request:
    paths: ["android/**", .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_UPLOAD_KEY: ${{ (secrets.ANDROID_KEYSTORE_B64 != '' || secrets.ANDROID_KEYSTORE != '') && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version code is the number of commits, so the whole history is needed.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit-test
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then echo "::error::Shallow checkout: the version code would be too low"; exit 1; fi
          VERSION="$(tr -d '[:space:]' < ../VERSION)"; CODE="$(git rev-list --count HEAD)"
          TASKS="assembleDebug testDebugUnitTest"
          if [ "$HAS_UPLOAD_KEY" = true ]; then
            # The upload key, from the secret (base64 of the .jks file), for this run only.
            printf '%s' "${ANDROID_KEYSTORE_B64:-$ANDROID_KEYSTORE}" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
            TASKS="$TASKS assembleRelease bundleRelease"
          fi
          LOG="$RUNNER_TEMP/gradle.txt"
          if ! ./gradlew --no-daemon $TASKS > "$LOG" 2>&1; then
            # Compiler errors and failed tests as annotations, then the tail of the log.
            grep -E "^e: |FAILED|AAPT: error|error:|What went wrong" -A2 "$LOG" | sort -u | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -60 "$LOG"; rm -f "$RUNNER_TEMP/upload.jks"; exit 1
          fi
          rm -f "$RUNNER_TEMP/upload.jks"
          grep -hoE 'tests="[0-9]+" skipped="[0-9]+" failures="[0-9]+" errors="[0-9]+"' app/build/test-results/testDebugUnitTest/*.xml \
            | awk -F'"' '{t+=$2; f+=$6+$8} END {print "::notice::Android unit tests: " t " run, " f " failed"}'
          ls -la app/build/outputs/apk/*/ app/build/outputs/bundle/release/ 2>/dev/null || true
          if [ "$HAS_UPLOAD_KEY" = true ]; then
            # Which key signed the release: Play Console shows the upload key's SHA-256 to compare with.
            CERT="$("$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 -E "certificate SHA-256 digest" | sed 's/.*digest: //')"
            echo "::notice::Golden Hour for Android $VERSION (version code $CODE): release APK and App Bundle signed with the upload key (SHA-256 $CERT)"
          else
            echo "::notice::Golden Hour for Android $VERSION (version code $CODE): debug APK only. Add the ANDROID_KEYSTORE secrets to build a signed release for Google Play."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: golden-hour-android
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Did VERSION change?
        id: version
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Only a push to main that raises VERSION (a new release) sends a build to testers on its own.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && ! git diff --quiet "$BEFORE" HEAD -- VERSION; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "VERSION changed in this push: this build goes to Google Play's closed test."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "VERSION didn't change in this push: nothing goes to Google Play."
          fi
      - name: Google Play closed test
        # Builds for testers only: main, signed with the upload key, and started by hand or by a push that changed
        # VERSION. The version code is main's commit count, so each new build is higher than the last; a second
        # run of the same commit is skipped by Play's own check (play_publish.py says so).
        if: env.HAS_PLAY == 'true' && env.HAS_UPLOAD_KEY == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || steps.version.outputs.changed == 'true')
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE: com.bradcowdrey.goldenhour
          PLAY_AAB: android/app/build/outputs/bundle/release/app-release.aab
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          export PLAY_RELEASE_NAME="$VERSION ($(git rev-list --count HEAD))"
          export PLAY_RELEASE_NOTES="Golden Hour $VERSION: which evenings are worth it, and a plan for the ones that are. The app shows the Golden Hour web app, so it gets each new version of the site as soon as it's published."
          echo "Release $PLAY_RELEASE_NAME"
          pip install --quiet pyjwt cryptography
          python3 .github/scripts/play_publish.py
