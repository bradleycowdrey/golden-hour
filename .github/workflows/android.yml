name: Android

# Builds the Android app: a debug APK, and a release APK and bundle signed with the upload key when the
# four ANDROID_ secrets are set (otherwise with a throwaway debug key, and it says so). The files are kept
# as an artifact. On main, the signed APK is also attached to the release for the current version, so
# there is a link to install it from: releases/latest/download/GoldenHour.apk.
on:
  push:
    branches: [main]
    paths: ["android/**", VERSION, .github/workflows/android.yml]
  pull_request:
    paths: ["android/**", .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          fi
          LOG="$RUNNER_TEMP/gradle.txt"
          if ! ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease > "$LOG" 2>&1; then
            grep -E "^e: |FAILED|AAPT: error|error:|What went wrong" -A2 "$LOG" | sort -u | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -60 "$LOG"; exit 1
          fi
          ls -la app/build/outputs/apk/*/ app/build/outputs/bundle/release/
          # Which key signed the release APK: the upload key (from the secrets) or a throwaway debug key.
          SIGNER=$("$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 "certificate DN" | sed 's/.*certificate DN: //')
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then echo "::notice::Release APK and bundle signed with the upload key ($SIGNER)"; echo "SIGNED=1" >> "$GITHUB_ENV"
          else echo "::warning::Release APK signed with a debug key ($SIGNER): the ANDROID_KEYSTORE secrets are not set on this repository"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: golden-hour-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Attach the APK to the release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/GoldenHour.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/GoldenHour.aab"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Golden Hour ${TAG#v}" --notes "Golden Hour ${TAG#v}. The Android app (GoldenHour.apk) installs directly; GoldenHour.aab is the file for Google Play."
          gh release upload "$TAG" "$RUNNER_TEMP/GoldenHour.apk" "$RUNNER_TEMP/GoldenHour.aab" --clobber
          echo "::notice::GoldenHour.apk and GoldenHour.aab attached to $TAG"
