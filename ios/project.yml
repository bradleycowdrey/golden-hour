# XcodeGen spec for Golden Hour on iPhone. .github/workflows/ios-testflight.yml generates
# GoldenHour.xcodeproj from this (the project file itself isn't committed).
name: GoldenHour
options:
  bundleIdPrefix: com.bradcowdrey
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO
targets:
  GoldenHour:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: GoldenHour
        PRODUCT_BUNDLE_IDENTIFIER: com.bradcowdrey.goldenhour
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}
